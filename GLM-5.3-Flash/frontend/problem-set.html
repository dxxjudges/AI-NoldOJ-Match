<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>训练计划详情 - NoldOJ</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script>try{if(localStorage.getItem('noldoj-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="/" class="brand">NoldOJ</a><div class="nav-links" id="nav-links"></div><div class="nav-right" id="nav-right"></div></div></nav>
<main class="container">
  <div class="card">
    <h2 id="t"></h2>
    <div id="d"></div>
    <h3>题目</h3>
    <div id="items"></div>
    <div class="muted mt" id="myprog"></div>
  </div>
</main>
<script src="/static/app.js"></script>
<script>
(async function () {
  const r = await NoldOJ.api('/problem-sets/' + NoldOJ.qs('id'));
  if (!r.ok) { document.getElementById('t').textContent = r.error; return; }
  document.getElementById('t').textContent = r.data.set.title;
  NoldOJ.renderMd(document.getElementById('d'), r.data.set.description_md || '');
  const solved = new Set((r.data.progress && r.data.progress.solved) || []);
  document.getElementById('items').innerHTML = r.data.items.length ? r.data.items.map((p, i) =>
    '<div class="flex spread mb"><a href="/problem.html?id=' + p.problem_id + '">' + (solved.has(p.problem_id) ? '<span class="st-ac">✔</span> ' : '') +
    (i + 1) + '. ' + NoldOJ.escapeHtml(p.title) + '</a>' + NoldOJ.diffBadge(p.difficulty) + '</div>').join('') : '<div class="muted">暂无题目</div>';
  if (r.data.progress) document.getElementById('myprog').textContent =
    '我的进度：' + r.data.progress.solved.length + ' / ' + r.data.items.length;
})();
</script>
</body>
</html>
