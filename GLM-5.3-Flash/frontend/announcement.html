<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>公告详情 - NoldOJ</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script>try{if(localStorage.getItem('noldoj-theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a href="/" class="brand">NoldOJ</a><div class="nav-links" id="nav-links"></div><div class="nav-right" id="nav-right"></div></div></nav>
<main class="container">
  <div class="card" id="body">加载中...</div>
</main>
<script src="/static/app.js"></script>
<script>
(async function () {
  const r = await NoldOJ.api('/announcements/' + NoldOJ.qs('id'));
  if (!r.ok) { document.getElementById('body').innerHTML = r.error; return; }
  NoldOJ.renderMd(document.getElementById('body'), '# ' + (r.data.pinned ? '📌 ' : '') + r.data.title + '\n\n' + (r.data.content_md || '') + '\n\n---\n*' + NoldOJ.escapeHtml(r.data.username || '') + ' · ' + new Date(r.data.created_at).toLocaleString('zh-CN') + '*');
})();
</script>
</body>
</html>
