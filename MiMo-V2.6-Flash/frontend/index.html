<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoldOJ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127942;</text></svg>">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <script>
    // theme bootstrap before paint — no flicker
    (function () {
      try {
        var t = localStorage.getItem('noldoj-theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="#/">Nold<span>OJ</span></a>
      <div class="nav-links" id="nav-links">
        <a href="#/problems" data-route="problems">题库</a>
        <a href="#/contests" data-route="contests">比赛</a>
        <a href="#/exams" data-route="exams">考试</a>
        <a href="#/problem-sets" data-route="problem-sets">题单</a>
        <a href="#/articles" data-route="articles">文章</a>
        <a href="#/announcements" data-route="announcements">公告</a>
        <a href="#/ide" data-route="ide">IDE</a>
        <a href="#/files" data-route="files">文件</a>
        <a href="#/ranking" data-route="ranking">排行</a>
        <a href="#/submissions" data-route="submissions">提交</a>
        <a href="#/admin" data-route="admin" id="nav-admin" hidden>管理</a>
      </div>
      <div class="nav-right">
        <input id="global-search" class="search-input" placeholder="搜索题目 / 比赛 / 文章" autocomplete="off">
        <span id="nav-rating" class="nav-rating" hidden></span>
        <button id="theme-toggle" class="icon-btn" title="切换深色模式" aria-label="切换主题">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path id="theme-icon" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <div id="nav-user" class="nav-user">
          <a href="#/login" class="btn btn-sm">登录</a>
          <a href="#/register" class="btn btn-sm btn-ghost">注册</a>
        </div>
      </div>
    </div>
  </nav>
  <main id="app" class="container">
    <div class="loading">加载中…</div>
  </main>
  <footer class="footer">NoldOJ · Windows 原生评测系统 · MIT License</footer>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
