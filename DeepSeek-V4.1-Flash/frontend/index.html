<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NoldOJ - 在线评测系统</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial'%3EN%3C/text%3E%3C/svg%3E" />
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('noldoj-theme');
        if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a class="brand" href="#/">
        <span class="brand-mark">N</span>
        <span class="brand-text">NoldOJ</span>
      </a>
      <nav class="nav-links">
        <a href="#/problems">题目</a>
        <a href="#/contests">比赛</a>
        <a href="#/problemsets">题单</a>
        <a href="#/exams">考试</a>
        <a href="#/articles">文章</a>
        <a href="#/announcements">公告</a>
        <a href="#/submissions">评测记录</a>
        <a href="#/ide">在线编程</a>
        <a href="#/rating">Rating榜</a>
      </nav>
      <div class="nav-right">
        <input id="global-search" class="search-input" type="search" placeholder="搜索题目 / 比赛 / 文章" autocomplete="off" />
        <div id="search-results" class="search-results" hidden></div>
        <button id="theme-toggle" class="icon-btn" title="切换深色模式" aria-label="切换深色模式">🌙</button>
        <span id="nav-rating" class="nav-rating"></span>
        <span id="nav-user" class="nav-user"></span>
      </div>
    </div>
  </header>

  <main id="app" class="app"></main>

  <footer class="footer">
    <span>NoldOJ · Windows 原生在线评测系统 · MIT License</span>
  </footer>

  <div id="toast" class="toast" hidden></div>
  <div id="modal-root"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/markdown.js"></script>
  <script src="/js/ws.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/pages/home.js"></script>
  <script src="/js/pages/auth.js"></script>
  <script src="/js/pages/problems.js"></script>
  <script src="/js/pages/submissions.js"></script>
  <script src="/js/pages/ide.js"></script>
  <script src="/js/pages/contests.js"></script>
  <script src="/js/pages/content.js"></script>
  <script src="/js/pages/exams.js"></script>
  <script src="/js/pages/user.js"></script>
  <script src="/js/pages/admin.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
